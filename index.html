<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Bull — Flavor Experience</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="site">
  <header class="header">
    <div class="logo">
      <div class="bulls">🐂</div>
      <div class="redbull">Red Bull</div>
      <div class="wings">GIVES YOU WINGS</div>
    </div>
    <nav>
      <a class="active">HOME</a>
      <a>FLAVORS</a>
      <a>ABOUT</a>
      <a>GALLERY</a>
    </nav>
    <div class="tools"><span>⌕</span><span>☰</span></div>
  </header>

  <section class="hero" id="hero">
    <div class="left-copy">
      <div class="edition" id="edition">ORIGINAL</div>
      <h1 id="title">RED BULL</h1>
      <h2>ENERGY DRINK</h2>
      <p id="description">The original Red Bull.<br>With the unique combination<br>of high-quality ingredients.</p>
      <button id="nextMain">NEXT FLAVOR <strong>→</strong></button>
    </div>

    <div class="product-stage">
      <div class="light-cloud cloud1"></div>
      <div class="light-cloud cloud2"></div>

      <div class="can-holder" id="canHolder">
        <img id="mainCan" alt="Red Bull can">
      </div>

      <div class="pedestal">
        <div class="pedestal-ring"></div>
        <div class="pedestal-top"></div>
        <div class="pedestal-side"></div>
        <div class="pedestal-bottom-glow"></div>
      </div>
    </div>

    <button class="next-side" id="nextSide">NEXT <i>→</i></button>

    <div class="page-count"><span id="count">1</span> / <span id="total">18</span></div>
  </section>

  <section class="carousel-area">
    <button class="circle-arrow" id="prev">←</button>
    <div class="carousel-window">
      <div class="carousel-track" id="track"></div>
    </div>
    <button class="circle-arrow" id="next">→</button>
    <div class="dots" id="dots"></div>
  </section>

  <div class="features">
    <div><span>ϟ</span><b>ENERGY</b></div>
    <div><span>◎</span><b>FOCUS</b></div>
    <div><span>♧</span><b>ACTION</b></div>
  </div>

  <footer>Independent educational school project — not an official Red Bull website.</footer>
</div>
<script src="script.js"></script>
</body>
</html>
